<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <checkbox
    id="zotero-prefpane-__addonRef__-enable"
    preference="enable"
    data-l10n-id="pref-enable"
  />
  <vbox style="margin-top: 8px">
    <checkbox
      id="zotero-prefpane-__addonRef__-enableExternalLookups"
      preference="enableExternalLookups"
      data-l10n-id="pref-enableExternalLookups"
    />
    <html:label
      data-l10n-id="pref-enableExternalLookups-help"
      style="opacity: 0.7; font-size: 0.9em; margin-left: 18px"
    ></html:label>
  </vbox>
  <vbox style="margin-top: 8px">
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-s2ApiKey"
        data-l10n-id="pref-s2ApiKey"
      ></html:label>
      <html:input
        type="password"
        id="zotero-prefpane-__addonRef__-s2ApiKey"
        preference="semanticScholarApiKey"
        style="margin-left: 6px; flex: 1"
      ></html:input>
    </hbox>
    <html:label
      data-l10n-id="pref-s2ApiKey-help"
      style="opacity: 0.7; font-size: 0.9em"
    ></html:label>
  </vbox>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
