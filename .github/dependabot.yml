# Dependabot config. Docs:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One weekly PR for every minor/patch bump. Major bumps still get their
      # own PR each, since they usually need individual compatibility checks.
      all-non-major:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # Security updates ignore the group above (it only applies to version
      # updates), so without this each vulnerable transitive dev dependency
      # gets its own PR.
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # Actions used in .github/workflows (e.g. actions/upload-artifact), all bumps
  # in one weekly PR. zotero-plugin-dev/workflows/setup-js is pinned to @main,
  # so Dependabot leaves it alone.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-actions:
        patterns:
          - "*"
